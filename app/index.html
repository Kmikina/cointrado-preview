<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d3b2c"><title>CoinTrado (Demo)</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0f0d;--card:#131c18;--line:#1f2c27;--em:#0d3b2c;--em2:#1f8a5f;--mint:#7fe0b4;--gold:#e8b44c;--tx:#eef3ef;--mu:#93a39b;--red:#ff7a6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:auto;min-height:100%;padding:0 18px 96px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.brand{display:flex;gap:8px;align-items:center;font-weight:800;font-size:19px}.brand b{color:var(--gold)}
.demo{background:#3a2a07;color:var(--gold);font-size:11px;padding:3px 8px;border-radius:99px;font-weight:800;letter-spacing:.04em}
.scr{animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}@media(prefers-reduced-motion:reduce){.scr{animation:none}}
h2{margin:6px 0 14px;font-size:24px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(145deg,#0f4a37,#0b2a20);border:0}.big{font-size:36px;font-weight:800;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.btn{width:100%;padding:15px;border-radius:16px;border:0;font-weight:800;font-size:16px;background:linear-gradient(135deg,#f2c45a,#c8902c);color:#1a1405;cursor:pointer;margin-top:10px}
.btn2{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--tx)}.qa i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0e1512;color:var(--tx);font-size:16px;margin:6px 0}label{font-size:13px;color:var(--mu)}
.seg{display:flex;background:#0e1512;border-radius:14px;padding:4px;margin:8px 0}.seg button{flex:1;padding:10px;border:0;border-radius:10px;background:none;color:var(--mu);font-weight:700}.seg .on{background:var(--em);color:var(--mint)}
.tot{color:var(--gold);font-weight:800}.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--em);color:var(--mint)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#0c1311ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;max-width:480px;width:100%}nav.tabs a{flex:1;text-align:center;padding:10px 0 12px;color:var(--mu);text-decoration:none;font-size:11px}nav.tabs a i{display:block;font-style:normal;font-size:20px}nav.tabs a.on{color:var(--gold)}
.steps{display:flex;gap:6px;margin:8px 0 16px}.steps span{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps .on{background:var(--gold)}
.bar{height:8px;background:#0e1512;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em2),var(--gold))}
.qr{width:190px;height:190px;margin:10px auto;background:#fff;border-radius:14px;padding:12px}
.tog{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0}.tog.on{background:var(--em2)}.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tog.on::after{left:23px}
[hidden]{display:none!important}</style></head><body><div id="app"></div><nav class="tabs" id="tabs" hidden><div></div></nav>
<script>
const T={en:{home:"Home",trade:"Trade",send:"Send",plan:"Plan",more:"More",bal:"Total balance (demo)",buy:"Buy",sell:"Sell",receive:"Receive",alerts:"Alerts",rate:"Demo rate",welcome:"Welcome to CoinTrado",wsub:"Bitcoin for Canadians, every fee on the table.",start:"Create demo account",next:"Continue",email:"Email",phone:"Mobile phone",verify:"Verify your identity",vwhy:"Canadian anti-money-laundering rules (FINTRAC) require us to confirm who you are. We collect only: legal name, date of birth, address, a government photo ID and a selfie.",review:"Review & confirm",confirm:"Confirm (demo)",settings:"Settings",lang:"Language",rewards:"Rewards & referrals",savings:"CAD savings goals",dca:"Recurring buys / DCA"},
fr:{home:"Accueil",trade:"Échanger",send:"Envoyer",plan:"Planifier",more:"Plus",bal:"Solde total (démo)",buy:"Acheter",sell:"Vendre",receive:"Recevoir",alerts:"Alertes",rate:"Taux démo",welcome:"Bienvenue chez CoinTrado",wsub:"Le bitcoin pour les Canadiens, tous les frais sur la table.",start:"Créer un compte démo",next:"Continuer",email:"Courriel",phone:"Téléphone mobile",verify:"Vérifiez votre identité",vwhy:"Les règles canadiennes anti-blanchiment (CANAFE) exigent de confirmer votre identité. Nous recueillons seulement : nom légal, date de naissance, adresse, pièce d'identité avec photo et égoportrait.",review:"Vérifier et confirmer",confirm:"Confirmer (démo)",settings:"Paramètres",lang:"Langue",rewards:"Récompenses et parrainage",savings:"Objectifs d'épargne CAD",dca:"Achats récurrents / PAC"}};
let S=JSON.parse(localStorage.ct||'{"lang":"en","onb":0,"side":"buy","amt":500,"asset":"BTC"}');const save=()=>localStorage.ct=JSON.stringify(S);
const t=k=>T[S.lang][k]||T.en[k];const DEMO=1;// mock price units, not real
const P={BTC:90000,ETH:4200,SOL:210,USDC:1.37};const H={BTC:.0423,ETH:.61,SOL:4.2,USDC:150};
const cad=n=>n.toLocaleString(S.lang=='fr'?'fr-CA':'en-CA',{style:'currency',currency:'CAD'});
const hdr=()=>`<div class="top"><div class="brand"><img src="logo.svg" width="30" alt=""><span>Coin<b>Trado</b></span></div><span class="demo">DEMO</span></div>`;
function spark(){let p=[],y=50;for(let i=0;i<40;i++){y+=Math.sin(i*1.7)*6+(i%7-3)*1.5;y=Math.max(10,Math.min(70,y));p.push(`${i*8},${80-y}`)}return `<svg viewBox="0 0 312 80" width="100%" height="80" aria-label="Demo price chart"><defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b44c" stop-opacity=".35"/><stop offset="1" stop-color="#e8b44c" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#f)" points="0,80 ${p.join(' ')} 312,80"/><polyline fill="none" stroke="#e8b44c" stroke-width="2.5" points="${p.join(' ')}"/></svg>`}
const V={
onb(){const s=S.onb;const st=`<div class="steps">${[0,1,2,3].map(i=>`<span class="${i<=s?'on':''}"></span>`).join('')}</div>`;
 if(s==0)return `<div style="text-align:center;padding-top:40px"><img src="logo.svg" width="96" alt="CoinTrado logo"><h2 style="font-size:30px">${t('welcome')}</h2><p class="mu">${t('wsub')}</p><div class="card mu" style="text-align:left">🧾 All-in fees before you confirm<br>🔔 Price alerts & DCA planner<br>🏪 In-person cash desk option<br>🇨🇦 EN / FR</div><button class="btn" onclick="go(1)">${t('start')}</button><p class="mu">Demo prototype — no real money or accounts.</p></div>`;
 if(s==1)return `${st}<h2>${t('email')} & ${t('phone')}</h2><label>${t('email')}</label><input type="email" value="alex@example.ca"><label>${t('phone')}</label><input type="tel" value="+1 514 555 0199"><p class="mu">We'll send a 6-digit code (demo: any code works).</p><input inputmode="numeric" placeholder="123456"><button class="btn" onclick="go(2)">${t('next')}</button>`;
 if(s==2)return `${st}<h2>${t('verify')}</h2><div class="card mu">${t('vwhy')}</div><div class="card"><div class="row">🪪 Government photo ID <span class="pill">Mock ✓</span></div><div class="row">🤳 Selfie liveness check <span class="pill">Mock ✓</span></div><div class="row">🏠 Address <span class="pill">Mock ✓</span></div></div><p class="mu">If we ever need to review your account, you'll see a status tracker, an expected timeline and an appeal path.</p><button class="btn" onclick="go(3)">${t('next')}</button>`;
 return `${st}<h2>You're verified 🎉</h2><div class="card">Fund your demo wallet:<div class="row">⚡ Interac e-Transfer <span class="pill">Demo</span></div><div class="row">🏪 Book a cash desk visit <span class="pill">Demo</span></div></div><button class="btn" onclick="S.onb=9;save();nav('home')">Go to dashboard</button>`},
home(){const tot=Object.keys(P).reduce((a,k)=>a+P[k]*H[k],0)+1250;return hdr()+`<div class="card hero"><div class="mu" style="color:#bfe8d4">${t('bal')}</div><div class="big">${cad(tot)}</div><div class="mu" style="color:#bfe8d4">CAD cash ${cad(1250)} · <span class="tot">+2.4% (demo)</span></div>${spark()}<div class="mu" style="color:#bfe8d4;font-size:12px">BTC/CAD · ${t('rate')} — mock data, not a market price</div></div>
<div class="grid"><button class="qa" onclick="S.side='buy';nav('trade')"><i>＋</i>${t('buy')}</button><button class="qa" onclick="S.side='sell';nav('trade')"><i>－</i>${t('sell')}</button><button class="qa" onclick="nav('send')"><i>↗</i>${t('send')}</button><button class="qa" onclick="nav('alerts')"><i>🔔</i>${t('alerts')}</button></div>
<div class="card"><b>Wallet</b>${Object.keys(P).map(k=>`<div class="row"><span>${{BTC:'₿',ETH:'Ξ',SOL:'◎',USDC:'$'}[k]} ${k}<br><span class="mu">${H[k]} ${k}</span></span><span>${cad(P[k]*H[k])}<br><span class="mu">${t('rate')}</span></span></div>`).join('')}</div>
<div class="card"><b>🎯 ${t('savings')}</b><p class="mu">Winter trip to Banff — ${cad(840)} / ${cad(2000)}</p><div class="bar"><i style="width:42%"></i></div></div>`},
trade(){const a=+S.amt||0,sp=.008,net=.0;const px=P[S.asset],fee=a*sp,crypto=(a-fee)/px;return hdr()+`<h2>${S.side=='buy'?t('buy'):t('sell')} ${S.asset}</h2><div class="seg"><button class="${S.side=='buy'?'on':''}" onclick="S.side='buy';r()">${t('buy')}</button><button class="${S.side=='sell'?'on':''}" onclick="S.side='sell';r()">${t('sell')}</button></div>
<label>Asset</label><select onchange="S.asset=this.value;r()">${Object.keys(P).map(k=>`<option ${k==S.asset?'selected':''}>${k}</option>`).join('')}</select><label>Amount (CAD)</label><input inputmode="decimal" value="${a}" onchange="S.amt=this.value;r()">
<div class="card"><b>All-in breakdown — before you confirm</b><div class="row"><span>Reference rate<br><span class="mu">Source: Demo rate feed · updated just now</span></span><span>${t('rate')}<br><span class="mu">${cad(px)}/${S.asset}</span></span></div><div class="row"><span>CoinTrado spread (disclosed)</span><span>0.80% · ${cad(fee)}</span></div><div class="row"><span>Funding / network fee</span><span>${cad(net)}</span></div><div class="row"><span>You ${S.side=='buy'?'pay':'sell'}</span><span class="tot">${cad(a)}</span></div><div class="row"><span>You ${S.side=='buy'?'receive':'get'}</span><span class="tot">${S.side=='buy'?crypto.toFixed(6)+' '+S.asset:cad(a-fee)}</span></div><p class="mu">⏱ Quote locked for 30s (demo). Demo values only — no real trade.</p></div>
<button class="btn" onclick="toast('Demo order placed — no real money moved')">${t('confirm')}</button>`},
send(){return hdr()+`<h2>${t('send')} / ${t('receive')}</h2><div class="seg"><button class="${S.sr!='r'?'on':''}" onclick="S.sr='s';r()">${t('send')}</button><button class="${S.sr=='r'?'on':''}" onclick="S.sr='r';r()">${t('receive')}</button></div>`+(S.sr=='r'?`<div class="card" style="text-align:center"><div class="qr">${qr()}</div><div class="mu" style="word-break:break-all">bc1q-demo-0000-not-a-real-address</div><span class="demo">DEMO ADDRESS — DO NOT SEND FUNDS</span></div>`:
`<label>To (CoinTrado handle or BTC address)</label><input placeholder="@friend or bc1…" value="@maple.sam"><label>Amount (BTC)</label><input value="0.0025"><div class="card"><div class="row"><span>Network fee (demo)</span><span>${cad(1.85)}</span></div><div class="row"><span>Total</span><span class="tot">0.0025 BTC + ${cad(1.85)}</span></div><p class="mu">ℹ️ You can send to friends on CoinTrado instantly, or to any wallet you control. We show plainly what's allowed before you send.</p></div><button class="btn" onclick="toast('Demo send — nothing was transmitted')">${t('review')}</button>`)},
plan(){const amt=+(S.dcaA||50),f=S.dcaF||'weekly',n=f=='weekly'?52:f=='biweekly'?26:12;return hdr()+`<h2>${t('dca')}</h2><div class="card"><label>Amount per buy (CAD)</label><input value="${amt}" onchange="S.dcaA=this.value;r()"><label>Frequency</label><div class="seg">${['weekly','biweekly','monthly'].map(x=>`<button class="${x==f?'on':''}" onclick="S.dcaF='${x}';r()">${x}</button>`).join('')}</div><div class="row"><span>Invested over 1 year</span><span class="tot">${cad(amt*n)}</span></div><div class="row"><span>Spread over 1 year (0.8%)</span><span>${cad(amt*n*.008)}</span></div><p class="mu">Projection of contributions only — no price forecast.</p><button class="btn" onclick="toast('Demo plan saved')">Start plan (demo)</button></div>
<div class="card"><b>🎯 ${t('savings')}</b><p class="mu">Winter trip — 42%</p><div class="bar"><i style="width:42%"></i></div><p class="mu">Emergency fund — 18%</p><div class="bar"><i style="width:18%"></i></div><button class="btn btn2" onclick="toast('Demo goal added')">+ New goal</button></div>`},
alerts(){const al=S.al||[{a:'BTC',d:'above',v:95000},{a:'ETH',d:'below',v:3800}];S.al=al;return hdr()+`<h2>🔔 ${t('alerts')}</h2><div class="card">${al.map((x,i)=>`<div class="row"><span>${x.a} ${x.d} ${cad(+x.v)}</span><button class="qa" style="padding:6px 10px" onclick="S.al.splice(${i},1);r()" aria-label="Delete alert">✕</button></div>`).join('')||'<p class="mu">No alerts</p>'}</div><div class="card"><select id="aa">${Object.keys(P).map(k=>`<option>${k}</option>`)}</select><select id="ad"><option>above</option><option>below</option></select><input id="av" inputmode="decimal" placeholder="Price in CAD"><button class="btn" onclick="S.al.push({a:aa.value,d:ad.value,v:av.value||0});r()">Add alert</button><p class="mu">Alerts compare to the demo rate feed only.</p></div>`},
more(){return hdr()+`<h2>${t('rewards')}</h2><div class="card hero"><div class="big" style="font-size:26px">2,450 pts</div><p style="color:#bfe8d4">Earn points for completing DCA plans and learning modules. Redeem for fee credits (demo).</p></div><div class="card"><b>Invite friends</b><p class="mu">You both get a $10 fee credit after their first buy (demo).</p><input readonly value="cointrado.demo/r/ALEX-MAPLE"><button class="btn btn2" onclick="toast('Link copied (demo)')">Copy link</button></div>
<h2>${t('settings')}</h2><div class="card"><div class="row"><span>${t('lang')}</span><div class="seg" style="margin:0;width:120px"><button class="${S.lang=='en'?'on':''}" onclick="S.lang='en';r()">EN</button><button class="${S.lang=='fr'?'on':''}" onclick="S.lang='fr';r()">FR</button></div></div>
${['Face ID / biometric login','Passkey','2-step verification','Withdrawal address allow-list','Large text'].map((x,i)=>`<div class="row"><span>${x}</span><button class="tog ${(S['g'+i]??i<3)?'on':''}" aria-label="${x}" onclick="S['g'+i]=!(S['g'+i]??${i<3});r()"></button></div>`).join('')}
<div class="row"><span>Account review status</span><span class="pill">Good standing</span></div></div><button class="btn btn2" onclick="localStorage.clear();location.hash='';location.reload()">Reset demo</button><p class="mu" style="text-align:center">CoinTrado demo prototype · not a registered dealer</p>`}};
function qr(){let s='',x=7;for(let i=0;i<21;i++)for(let j=0;j<21;j++){x=(x*73+i*j+11)%97;const f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);const on=f?((i%6==0||j%6==0||(i%14>1&&i%14<5&&j%14>1&&j%14<5))&&!(i==6&&j>6&&j<14)&&!(j==6&&i>6&&i<14)):x%2;if(on)s+=`<rect x="${j}" y="${i}" width="1" height="1"/>`}return `<svg viewBox="0 0 21 21" width="166" height="166" shape-rendering="crispEdges">${s}</svg>`}
const tabs=[['home','🏠'],['trade','⇄'],['send','↗'],['plan','📅'],['more','⚙️']];
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f8a5f;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:9';d.setAttribute('role','status');document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function go(n){S.onb=n;save();r()}
function nav(v){location.hash=v}
function r(){save();document.documentElement.lang=S.lang;let v=location.hash.slice(1)||'home';if(S.onb<9&&!v.startsWith('onb'))v='onb';if(v.startsWith('onb')){if(v.length>3)S.onb=+v[3]||0;v='onb'}
 document.getElementById('app').innerHTML=`<div class="scr">${V[v]?V[v]():V.home()}</div>`;const tb=document.getElementById('tabs');tb.hidden=v=='onb';tb.firstElementChild.innerHTML=tabs.map(([k,i])=>`<a href="#${k}" class="${k==v?'on':''}"><i>${i}</i>${t(k)}</a>`).join('');scrollTo(0,0)}
addEventListener('hashchange',()=>{if(location.hash.length>1&&S.onb<9&&location.hash!='#onb')S.onb=9;r()});
if(new URLSearchParams(location.search).has('skip'))S.onb=9;r();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
